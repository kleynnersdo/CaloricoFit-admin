services:
  db:
    image: postgres:16-alpine
    container_name: caloricofit-smoke-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calorico
      POSTGRES_PASSWORD: calorico_smoke
      POSTGRES_DB: caloricofit
    ports:
      - "15433:5432"
    volumes:
      - caloricofit_smoke_data:/var/lib/postgresql/data
      - ./db/smoke:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorico -d caloricofit"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: caloricofit-smoke-adminer
    restart: unless-stopped
    ports:
      - "8092:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  caloricofit_smoke_data:
