services:
  db:
    image: postgres:16-alpine
    container_name: caloricofit-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calorico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: caloricofit
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - caloricofit_prod_data:/var/lib/postgresql/data
      - ./db/smoke/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/prod/01_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calorico -d caloricofit"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  caloricofit_prod_data:
