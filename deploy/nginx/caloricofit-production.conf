# Producción — reemplazar CALORICO_DOMAIN antes de copiar
# certbot --nginx -d CALORICO_DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name CALORICO_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name CALORICO_DOMAIN;

    # certbot añade ssl_certificate y ssl_certificate_key

    root /opt/apps/caloricofit/dist;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3032/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
